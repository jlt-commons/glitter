name: CI

# ---------------------------------------------------------------------------
# Runs on pull requests and pushes to main, plus manual dispatch.
#
# Scope note: this gate is HEADLESS ONLY. glitter's twenty-seven live-GTK smokes
# (`bb smokes`) open real GTK4 windows and need a display, so they are a local
# / maintainer gate rather than a CI one — see CONTRIBUTING.md. What CI proves
# is that the unit suite passes and the tree is lint-, format- and ns-clean on
# a machine that is not the maintainer's.
#
# The lint gate is `bb lint:errors`, not `bb lint:strict`, deliberately: it is
# the same gate the project's own `bb hooks:install` pre-commit hook uses, so
# CI and a clean local commit agree. `lint:strict` additionally fails on
# warnings, of which the tree currently carries two known ones.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

permissions:
  contents: read

# jolt is pinned for the same reason the other tool versions below are pinned:
# a floating `latest` lets a release published overnight turn CI red on a tree
# nobody touched. That is not hypothetical here. jolt v0.8.0 published on
# 2026-09-01 and reverses jolt.ffi/write's last two arguments (jolt-lang/jolt#802),
# and both spellings are plain integers, so an older or newer runtime than the
# code expects writes to the wrong place and reports nothing.
#
# Moving this pin IS the cutover commit for a breaking jolt change. Bump it and
# adapt the call sites together, in one reviewed commit. To try a candidate
# first, use a workflow_dispatch run with the jolt-version input, which
# overrides this for that run only.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.2' }}

jobs:
  gates:
    name: test · lint · format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # deps.edn's :jolt/native looks for libglib-2.0.so.0 / libgobject-2.0.so.0
      # / libgio-2.0.so.0 / libgtk-4.so.1, falling back to the unversioned .so
      # names. The -dev package ships both, so it covers either resolution path;
      # the runtime packages alone would only satisfy the versioned one.
      - name: Install GTK4 and GLib
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev

          echo "::group::what resolved"
          ldconfig -p | grep -E 'libgtk-4|libglib-2\.0|libgobject-2\.0|libgio-2\.0' || true
          echo "::endgroup::"

      # Official install script from jolt's README. Passed through env rather
      # than interpolated into the script body, so the input can't be used for
      # shell injection.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          jolt --version

      # Pinned to match what the maintainer runs locally and what the
      # `bb hooks:install` pre-commit hook enforces. Floating these to `latest`
      # would let CI disagree with a clean local commit whenever clj-kondo or
      # clojure-lsp changes a default. `cli` is needed by clojure-lsp for
      # classpath discovery and by `bb lint`'s fallback path.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196
          clj-kondo: "2026.05.25"
          cli: latest

      - uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        with:
          clojure-lsp-version: "2026.05.05-12.58.26"

      # The unit suite runs entirely against glitter.test-renderer, the
      # in-memory IRender/IMemory fake — no window, no display. Failure output
      # is re-emitted as an annotation plus a job summary, both readable
      # without downloading the log archive.
      - name: Unit suite
        run: |
          set +e
          out="$(bb test 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              printf '### `bb test` failed (exit %s)\n\n```\n%s\n```\n' \
                "$rc" "$(printf '%s\n' "$out" | tail -60)"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | tail -c 2000 \
              | python3 -c 'import sys; print("::error title=bb test failed::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$rc"

      # `.clj-kondo/hooks/jolt_ffi.clj` rewrites jolt.ffi/defcfn into an
      # equivalent defn so clj-kondo can see through the FFI macro. Without it
      # every gtk-*/g-* binding reports as unresolved.
      - name: clj-kondo
        run: bb lint:errors

      # Formatting is owned by clojure-lsp, not cljfmt — the two disagree on
      # some compact literal tables. See CONTRIBUTING.md.
      - name: Formatting
        run: bb lsp:format-check

      - name: Namespace forms
        run: bb lsp:clean-ns-check

      # Runs only when something above failed. The native libraries are present
      # as FILES well before anything dlopens them, so a library that resolves
      # but won't load (a missing runtime dependency on a headless runner) gets
      # past the install step and fails later. This reports the linkage facts
      # that tell those two apart.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          lib="$(ldconfig -p | grep -m1 'libgtk-4' | awk '{print $NF}')"
          {
            echo "resolved libgtk-4: ${lib:-<not in ldconfig cache>}"
            echo
            echo "ldd:"
            if [ -n "$lib" ]; then ldd "$lib" 2>&1; else echo "  (skipped — no library to inspect)"; fi
            echo
            echo "unresolved above (if any) are the missing runtime deps."
            echo
            echo "jolt:  $(jolt --version 2>&1 | head -1)"
            echo "bb:    $(bb --version 2>&1 | head -1)"
          } > /tmp/diag.txt
          cat /tmp/diag.txt
          {
            printf '### Diagnostics\n\n```\n'; cat /tmp/diag.txt; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -c 2000 /tmp/diag.txt \
            | python3 -c 'import sys; print("::error title=GTK4 diagnostics::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
